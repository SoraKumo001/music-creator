name = "music-creator"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
# Worker から index.html を取得して OGP の絶対URLを注入するため binding を張る
binding = "ASSETS"
# "/" も Worker に通す (静的アセットへ直接配信させない)
run_worker_first = ["/api/*", "/"]

[vars]
# ---- AI プロバイダ設定 ----
# OpenAI 互換 API ならどれでも使える。詳細: docs/llm-provider.md
#   openai | azure | openrouter | groq | deepseek | ollama | opencode | custom
LLM_PROVIDER = "opencode"
# 既定プロバイダ (opencode) のエンドポイントとモデル
LLM_BASE_URL = "https://opencode.ai/inference/go/openai/v1"
LLM_MODEL = "deepseek-v4.1-flash"
# プロバイダ固有の body 拡張。opencode では推論無効化で約10倍速い
# (OpenAI 等に切り替えるときは空にする)
LLM_EXTRA_BODY = "{\"thinking\":{\"type\":\"disabled\"}}"
# タイムアウトとリトライ
LLM_TIMEOUT_MS = "60000"
LLM_MAX_RETRIES = "2"
# APIキーは `wrangler secret put LLM_API_KEY` (ローカルは .dev.vars)

# 例: OpenAI 本家に切り替える場合
# [env.openai.vars]
# LLM_PROVIDER = "openai"
# LLM_MODEL = "gpt-4o-mini"
# LLM_BASE_URL = "https://api.openai.com/v1"
# LLM_EXTRA_BODY = ""
# (デプロイは wrangler deploy --env openai。シークレットも --env ごとに設定)
