<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Creator</title>
<style>
  :root { --bg:#fafaf8; --fg:#1d1d1f; --muted:#6b6b70; --card:#fff; --line:#e2e2e0; --accent:#3b5bdb; --accent-fg:#fff; --note:#3b5bdb; --grid:#ececea; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#141416; --fg:#ececee; --muted:#9a9aa2; --card:#1e1e22; --line:#33333a; --accent:#7b93ff; --accent-fg:#101014; --note:#7b93ff; --grid:#2a2a30; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif; }
  main { max-width:760px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  label { display:block; font-size:.875rem; color:var(--muted); margin-bottom:4px; }
  input[type="range"] { width:100%; accent-color:var(--accent); }
  input[type="checkbox"] { width:auto; accent-color:var(--accent); }
  output { color:var(--muted); font-size:.8125rem; }
  textarea, select { width:100%; font:inherit; color:inherit; background:transparent; border:1px solid var(--line); border-radius:8px; padding:10px; }
  textarea { min-height:96px; resize:vertical; }
  .row { display:flex; gap:12px; align-items:end; margin-top:12px; flex-wrap:wrap; }
  .row > div { flex:1 1 140px; }
  button { font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-fg); padding:10px 20px; }
  button.secondary { background:transparent; color:var(--accent); }
  button:disabled { opacity:.5; cursor:wait; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .chip { font-size:.8125rem; padding:4px 10px; background:transparent; color:var(--muted); border:1px solid var(--line); }
  #status { margin:16px 0; color:var(--muted); min-height:1.6em; }
  #status.err { color:#d6336c; }
  #result { display:none; margin-top:16px; }
  #meta { color:var(--muted); font-size:.875rem; margin:4px 0 12px; }
  .rollwrap { position:relative; }
  canvas { width:100%; height:240px; display:block; border:1px solid var(--line); border-radius:8px; background:var(--card); }
  #head { position:absolute; inset:0; background:transparent; border-color:transparent; pointer-events:none; }
  .row button { flex:0 0 auto; }
  .legend { display:flex; gap:12px; flex-wrap:wrap; font-size:.8125rem; color:var(--muted); margin:8px 0 12px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:baseline; }
  button.sm { padding:4px 10px; font-size:.8125rem; border-radius:6px; }
  button.danger { border-color:#d6336c; color:#d6336c; }
  button.danger:hover { background:#d6336c15; }
  .song-list { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  .song-item { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); gap:12px; flex-wrap:wrap; }
  .song-info { flex:1 1 240px; }
  .song-title { font-weight:600; font-size:.9375rem; margin-bottom:2px; }
  .song-meta { font-size:.75rem; color:var(--muted); display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .song-meta .tag { padding:1px 6px; border-radius:4px; background:var(--card); border:1px solid var(--line); }
  .song-actions { display:flex; gap:6px; flex:0 0 auto; }
</style>
</head>
<body>
<main>
  <h1>Music Creator</h1>
  <p class="sub">曲のイメージを書くと、AIが作曲してMIDIファイルを出力します。</p>
  <p class="sub" id="ai-status" title="サーバーの環境変数 (LLM_PROVIDER / LLM_MODEL) で切り替えられます">AI: 確認中…</p>

  <form id="form" class="card">
    <label for="prompt">どんな曲にしますか?</label>
    <textarea id="prompt" maxlength="1000" placeholder="例: 雨の夜に聴きたい、静かなローファイ。ピアノ中心でゆったり">ローファイな夜のBGM</textarea>
    <div class="chips" id="chips"></div>
    <div class="row">
      <div>
        <label for="bars">長さ</label>
        <select id="bars">
          <option value="4">4小節</option>
          <option value="8" selected>8小節</option>
          <option value="16">16小節</option>
          <option value="32">32小節</option>
        </select>
      </div>
      <div>
        <label for="complexity">構成</label>
        <select id="complexity" title="rich: 長尺・転調・対旋律などを許す">
          <option value="simple">シンプル</option>
          <option value="standard" selected>スタンダード</option>
          <option value="rich">リッチ (複雑)</option>
        </select>
      </div>
      <div>
        <label for="ensemble">編成</label>
        <select id="ensemble">
          <option value="band" selected>バンド</option>
          <option value="orchestra">オーケストラ</option>
        </select>
      </div>
      <div style="flex:0 0 auto">
        <label for="loop">ループ用</label>
        <input id="loop" type="checkbox" title="最後を終止させず、次の周へ自然につなげます">
      </div>
      <div>
        <label for="creativity">個性 (0=定番 / 1=冒険)</label>
        <select id="creativity">
          <option value="0.3">定番寄り</option>
          <option value="0.5" selected>バランス</option>
          <option value="0.8">冒険寄り</option>
        </select>
      </div>
      <div>
        <label for="seed">seed (空=おまかせ)</label>
        <input id="seed" type="number" min="0" max="4294967295" placeholder="例: 42" style="width:100%;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:8px;padding:10px;">
      </div>
      <button id="go" type="submit">作曲する</button>
    </div>
  </form>

  <div id="status" role="status" aria-live="polite"></div>

  <section id="result" class="card">
    <strong id="title"></strong>
    <div id="meta"></div>
    <div class="rollwrap">
      <canvas id="roll" aria-label="ピアノロール"></canvas>
      <canvas id="head" aria-hidden="true"></canvas>
    </div>
    <div class="legend" id="legend"></div>
    <div class="row" style="margin-top:0">
      <button id="play" type="button">▶ 試聴</button>
      <button id="dl" class="secondary" type="button">MIDIをダウンロード</button>
      <button id="save" class="secondary" type="button">★ OPFSに保存</button>
      <div style="flex:0 0 auto;display:flex;align-items:center;gap:6px">
        <input id="auditionLoop" type="checkbox" title="試聴を繰り返し再生します">
        <label for="auditionLoop" style="margin:0">ループ再生</label>
      </div>
    </div>
    <div class="row" style="margin-top:8px">
      <div>
        <label for="volume">音量 <output id="volout">85%</output></label>
        <input id="volume" type="range" min="0" max="100" step="1" value="85">
      </div>
    </div>
  </section>

  <section id="library" class="card" style="margin-top:24px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px">
      <div>
        <strong style="font-size:1.05rem">📁 保存した楽曲 (OPFS)</strong>
        <span id="libCount" style="color:var(--muted);font-size:.8125rem;margin-left:6px">0 件</span>
      </div>
      <button id="clearAll" class="secondary danger sm" type="button" style="display:none">全曲削除</button>
    </div>
    <div id="libStatus" style="color:var(--muted);font-size:.875rem"></div>
    <div id="songList" class="song-list"></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script>
const $ =(id) => document.getElementById(id);
const COLORS = ["#3b5bdb", "#e8590c", "#2f9e44", "#ae3ec9", "#c2255c", "#0c8599", "#a67c00", "#495057"];
let current = null;
// 試聴のループ再生フラグ。新曲の作曲時は作曲フォームの「ループ用」に合わせ、
// ユーザーの切替は localStorage に保存して次回以降も使う
let auditionLoop = false;
try {
  auditionLoop = localStorage.getItem("mc-audition-loop") === "1";
} catch {}

const examples = ["ローファイな夜のBGM", "疾走感のあるロック", "静かなクラシックのピアノ曲", "ジャズの小品", "明るいEDM"];
for (const ex of examples) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip secondary"; b.textContent = ex;
  b.onclick = () => { $("prompt").value = ex; };
  $("chips").appendChild(b);
}

let timer;
function startProgress() {
  const t0 = Date.now();
  const tick = () => { $("status").textContent = `作曲中… ${Math.round((Date.now() - t0) / 1000)}秒(通常10秒前後)`; };
  tick(); timer = setInterval(tick, 1000);
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (typeof Tone !== "undefined") stop();
  $("go").disabled = true; $("status").className = ""; $("result").style.display = "none";
  startProgress();
  try {
    const seedVal = $("seed").value.trim();
    const requestParams = {
      prompt: $("prompt").value.trim(),
      bars: Number($("bars").value),
      loop: $("loop").checked,
      ensemble: $("ensemble").value,
      creativity: Number($("creativity").value),
      complexity: $("complexity").value,
      seed: seedVal === "" ? null : Number(seedVal),
    };
    const res = await fetch("/api/compose", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ...requestParams, ...(seedVal === "" ? {} : { seed: Number(seedVal) }) }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(typeof data.error === "string" ? data.error : "入力が正しくありません");
    current = {
      ...data,
      id: `song_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
      title: data.score.title,
      createdAt: new Date().toISOString(),
      request: requestParams,
      saved: false,
    };
    show(current);
    if (window.updateSaveButton) window.updateSaveButton();
    $("status").textContent = "";
  } catch (err) {
    $("status").className = "err"; $("status").textContent = "失敗しました: " + err.message;
  } finally {
    clearInterval(timer); $("go").disabled = false;
  }
});

function show({ score, attempts = 1 }) {
  $("result").style.display = "block";
  $("title").textContent = score.title;
  const notes = score.tracks.reduce((n, t) => n + t.notes.length, 0);
  $("meta").textContent = `${score.bpm} BPM ・ ${score.key} ・ ${score.timeSignature.join("/")} ・ ${score.tracks.length}トラック ・ ${notes}音` + (attempts > 1 ? ` ・ 再生成${attempts - 1}回` : "");
  $("legend").innerHTML = "";
  score.tracks.forEach((t, i) => {
    const s = document.createElement("span");
    s.innerHTML = `<i style="background:${COLORS[i % COLORS.length]}"></i>`;
    s.append(t.name);
    $("legend").appendChild(s);
  });
  // ループ用作曲なら試聴もループ再生を初期ONにする (ユーザーが後から切替可)
  auditionLoop = $("loop").checked;
  try { localStorage.setItem("mc-audition-loop", auditionLoop ? "1" : "0"); } catch {}
  $("auditionLoop").checked = auditionLoop;
  drawRoll(score);
}

function drawRoll(score) {
  const cv = $("roll"), dpr = devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext("2d"); g.scale(dpr, dpr); g.clearRect(0, 0, W, H);
  const melodic = score.tracks.filter((t) => t.channel !== 9);
  const all = melodic.flatMap((t) => t.notes);
  const total = Math.max(1, ...score.tracks.flatMap((t) => t.notes.map((n) => n.start + n.duration)));
  const lo = all.length ? Math.min(...all.map((n) => n.pitch)) - 1 : 48;
  const hi = all.length ? Math.max(...all.map((n) => n.pitch)) + 1 : 72;
  const barBeats = score.timeSignature[0] * 4 / score.timeSignature[1];
  const grid = getComputedStyle(document.documentElement).getPropertyValue("--grid");
  g.strokeStyle = grid; g.lineWidth = 1;
  for (let b = 0; b <= total; b += barBeats) { const x = Math.round(b / total * W) + .5; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  // セクション名と境界線
  const css = getComputedStyle(document.documentElement);
  const TOP = 18;
  g.font = "11px system-ui, sans-serif"; g.textBaseline = "top";
  for (const s of (current && current.sections) || []) {
    const x = Math.round(s.startBar * barBeats / total * W);
    g.strokeStyle = css.getPropertyValue("--muted"); g.beginPath(); g.moveTo(x + .5, 0); g.lineTo(x + .5, H); g.stroke();
    g.fillStyle = css.getPropertyValue("--muted"); g.fillText(s.name, x + 4, 3);
  }
  const nh = Math.max(2, (H - TOP) / (hi - lo + 1));
  score.tracks.forEach((t, i) => {
    if (t.channel === 9) return; // ドラムは音程がないため非表示
    g.fillStyle = COLORS[i % COLORS.length]; g.globalAlpha = .85;
    for (const n of t.notes) {
      const x = n.start / total * W, w = Math.max(2, n.duration / total * W - 1);
      const y = H - (n.pitch - lo + 1) * nh;
      g.fillRect(x, y, w, nh - 1);
    }
  });
  g.globalAlpha = 1;
}
addEventListener("resize", () => current && drawRoll(current.score));

// ---- ブラウザ試聴 (Tone.js) ----
let playing = false, raf = 0, disposables = [], busNodes = [];
const midiHz = (p) => 440 * Math.pow(2, (p - 69) / 12);
/** 低ベロシティを底上げする (線形だと小さい音が埋もれる) */
const vel = (n) => Math.sqrt(Math.max(0, Math.min(1, n.velocity / 127)));
/** マスター音量: 0-100% を 0-1.8 のゲインへ (知覚に合わせて 2 乗) */
const gainFor = (pct) => 1.8 * Math.pow(pct / 100, 2);

let volumePct = 85;
try {
  // 未保存は null。Number(null) は 0 になるため、必ず生の値で存在確認してから数値化する
  const raw = localStorage.getItem("mc-volume");
  if (raw !== null && raw.trim() !== "") {
    const saved = Number(raw);
    if (Number.isFinite(saved) && saved >= 0 && saved <= 100) volumePct = saved;
  }
} catch {}

/** マスターバス: 音量 → 空間系(リバーブ) → コンプレッサー → リミッター → 出力 */
function createBus() {
  const gain = new Tone.Gain(gainFor(volumePct));
  const reverb = new Tone.Freeverb({ roomSize: 0.62, dampening: 3500, wet: 0.2 });
  const comp = new Tone.Compressor({ threshold: -16, ratio: 3, attack: 0.002, release: 0.25 });
  const limiter = new Tone.Limiter(-1.5);
  gain.chain(reverb, comp, limiter, Tone.Destination);
  busNodes = [gain, reverb, comp, limiter];
  return gain;
}

function buildVoice(program, dest, volumeDb) {
  if (program >= 32 && program <= 39) { // ベース
    const s = new Tone.MonoSynth({ oscillator: { type: "triangle" }, envelope: { attack: .01, decay: .2, sustain: .6, release: .2 }, volume: volumeDb }).connect(dest);
    return { play: (n, t, d) => s.triggerAttackRelease(midiHz(n.pitch), d, t, vel(n)), nodes: [s] };
  }
  const type = program >= 40 && program <= 55 ? "sawtooth" : program >= 80 && program <= 95 ? "square" : "triangle";
  const s = new Tone.PolySynth(Tone.Synth, { oscillator: { type }, envelope: { attack: .02, decay: .2, sustain: .55, release: .5 }, volume: volumeDb }).connect(dest);
  s.maxPolyphony = 8;
  return { play: (n, t, d) => s.triggerAttackRelease(midiHz(n.pitch), d, t, vel(n)), nodes: [s] };
}

function buildDrums(dest) {
  const kick = new Tone.MembraneSynth({ volume: -2 }).connect(dest);
  const snare = new Tone.NoiseSynth({ envelope: { attack: .001, decay: .15, sustain: 0 }, volume: -8 }).connect(dest);
  const hat = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: .001, decay: .04, sustain: 0 }, volume: -16 }).connect(dest);
  const crash = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: .001, decay: .35, sustain: 0 }, volume: -16 }).connect(dest);
  return {
    play: (n, t) => {
      const v = vel(n);
      if (n.pitch === 35 || n.pitch === 36) kick.triggerAttackRelease("C1", .15, t, v);
      else if (n.pitch === 38 || n.pitch === 40 || n.pitch === 39) snare.triggerAttackRelease(.1, t, v);
      else if ([49, 51, 52, 55, 57].includes(n.pitch)) crash.triggerAttackRelease(.35, t, v);
      else if (n.pitch >= 41 && n.pitch <= 50 && ![42, 44, 46].includes(n.pitch)) kick.triggerAttackRelease(midiHz(n.pitch - 12), .15, t, v * .7);
      else hat.triggerAttackRelease(.04, t, v);
    },
    nodes: [kick, snare, hat, crash],
  };
}

/** 再生ヘッドの描画 (SpessaSynth / Tone.js 共通)。位置と寿命の判断はポーリング時計に一本化 */
function animateHead() {
  const h = $("head"), dpr = devicePixelRatio || 1;
  h.width = h.clientWidth * dpr; h.height = h.clientHeight * dpr;
  const g = h.getContext("2d");
  const frame = () => {
    if (!playing) return;
    const d = playTotal, t = headPos();
    const x = d > 0 ? Math.min(1, t / d) * h.width : 0;
    g.clearRect(0, 0, h.width, h.height);
    g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--fg");
    g.fillRect(x, 0, 2 * dpr, h.height);
    raf = requestAnimationFrame(frame);
  };
  frame();
}

// ---- ポーリング駆動の再生時計 ----
// エンジン内部の時刻取得に頼らず、自前の時計でゲージ位置と周の終わりを判定する。
// これにより API の個体差 (ラップ有無・非同期遅延) に左右されず、ループとゲージが一致する。
let playTotal = 0; // 1周の長さ (秒)。Score から算出
let playEpoch = 0; // 今周の開始時刻 (performance.now(), ms)
let pollTimer = 0; // 周端検知ポーリングのタイマ
let pollEngine = null; // 'spessa' | 'tone': 再生中のエンジン

/** 再生ヘッドの現在位置 (秒)。ループONなら周回、OFFなら末端で止まる */
const headPos = () => {
  const raw = Math.max(0, (performance.now() - playEpoch) / 1000);
  if (playTotal > 0) return auditionLoop ? raw % playTotal : Math.min(raw, playTotal);
  return raw;
};

/** 周の終わりをポーリングで検知し、ループ継続または停止する */
function startPolling(total, engine) {
  stopPolling();
  playTotal = total;
  pollEngine = engine;
  playEpoch = performance.now();
  pollTimer = setInterval(() => {
    if (!playing) return;
    if (playTotal <= 0) return;
    const raw = (performance.now() - playEpoch) / 1000;
    if (raw < playTotal) return;
    if (!auditionLoop) { stop(); return; }
    if (pollEngine === "spessa") {
      // 読込済みデータの先頭に戻すだけなので再取得なし = 速い
      if (window.SpessaPlayer.replay()) {
        playEpoch = performance.now();
      } else {
        stop();
      }
    } else {
      // Tone は Transport.loop で音が周回済み。時計だけ巻き戻す
      playEpoch = performance.now();
    }
  }, 120);
}
function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = 0; }
  pollEngine = null;
}

function stop() {
  playing = false; cancelAnimationFrame(raf); stopPolling();
  if (window.SpessaPlayer) { try { window.SpessaPlayer.stop(); } catch {} }
  if (typeof Tone !== "undefined") {
    Tone.Transport.stop(); Tone.Transport.cancel(); Tone.Transport.loop = false;
  }
  disposables.forEach((n) => n.dispose()); disposables = [];
  busNodes.forEach((n) => n.dispose()); busNodes = [];
  const h = $("head"); h.getContext("2d").clearRect(0, 0, h.width, h.height);
  $("play").textContent = "▶ 試聴";
}

async function play() {
  const status = $("status");
  const { score } = current, spb = 60 / score.bpm;
  const total = Math.max(...score.tracks.flatMap((t) => t.notes.map((n) => n.start + n.duration))) * spb;
  // 高音質: SpessaSynth + General MIDI サウンドフォント (CDN から遅延ロード)
  if (window.SpessaPlayer) {
    try {
      status.className = ""; status.textContent = "音源を準備しています… (初回は少し時間がかかります)";
      await window.SpessaPlayer.play(current.midi, volumePct);
      status.textContent = "";
      playing = true; $("play").textContent = "■ 停止";
      startPolling(total, "spessa");
      animateHead();
      return;
    } catch (e) {
      console.warn("SpessaSynth の再生に失敗したため Tone.js にフォールバックします", e);
      status.textContent = "";
    }
  }
  // フォールバック: Tone.js による簡易シンセ
  if (typeof Tone === "undefined") { status.className = "err"; status.textContent = "試聴用ライブラリを読み込めませんでした"; return; }
  await Tone.start();
  const bus = createBus();
  // 同音色 (ディヴィジ) のパートは 1 つのシンセにまとめて発音数を抑える
  const byProgram = new Map();
  for (const t of score.tracks) {
    if (t.channel === 9) continue;
    const list = byProgram.get(t.program);
    if (list) list.push(...t.notes);
    else byProgram.set(t.program, [...t.notes]);
  }
  // 音色数が多いほど 1 音色あたりを下げ、合計がコンプレッサーを潰さないようにする
  const volumeDb = -6 - 10 * Math.log10(Math.max(1, byProgram.size / 4));
  for (const [program, notes] of byProgram) {
    const v = buildVoice(program, bus, volumeDb);
    disposables.push(...v.nodes);
    for (const n of notes) Tone.Transport.schedule((time) => v.play(n, time, n.duration * spb), n.start * spb);
  }
  let drumVoice = null;
  for (const t of score.tracks) {
    if (t.channel !== 9) continue;
    if (!drumVoice) { drumVoice = buildDrums(bus); disposables.push(...drumVoice.nodes); }
    for (const n of t.notes) Tone.Transport.schedule((time) => drumVoice.play(n, time), n.start * spb);
  }
  // ループ再生ONなら Transport を周回させて途切れなく繰り返す (時計の巻戻しはポーリング側)
  if (auditionLoop) {
    Tone.Transport.loop = true;
    Tone.Transport.loopStart = 0;
    Tone.Transport.loopEnd = total;
  }
  Tone.Transport.start("+0.1");
  playing = true; $("play").textContent = "■ 停止";
  startPolling(total, "tone");
  playEpoch += 100; // start("+0.1") の遅延分だけ時計をずらす
  animateHead();
}

$("play").onclick = () => (playing ? stop() : play());

// 試聴ループ再生の切替。再生中でも即時反映する
$("auditionLoop").checked = auditionLoop;
$("auditionLoop").addEventListener("change", (e) => {
  const pos = headPos(); // 切替前のヘッド位置を保持し、ゲージが飛ばないようにする
  auditionLoop = e.target.checked;
  try { localStorage.setItem("mc-audition-loop", auditionLoop ? "1" : "0"); } catch {}
  playEpoch = performance.now() - pos * 1000;
  if (playing && typeof Tone !== "undefined" && pollEngine === "tone" && playTotal > 0) {
    if (auditionLoop) {
      Tone.Transport.loop = true;
      Tone.Transport.loopStart = 0;
      Tone.Transport.loopEnd = playTotal;
    } else {
      // 周回をやめ、今周の終わりでポーリングが止める
      Tone.Transport.loop = false;
    }
  }
  // Spessa 側はポーリングが周端を検知して継続/停止するため、ここでの操作は不要
});

$("volume").value = String(volumePct);
$("volout").textContent = `${volumePct}%`;
$("volume").addEventListener("input", (e) => {
  volumePct = Number(e.target.value);
  $("volout").textContent = `${volumePct}%`;
  try { localStorage.setItem("mc-volume", String(volumePct)); } catch {}
  if (window.SpessaPlayer) window.SpessaPlayer.setVolume(volumePct);
  if (busNodes[0]) busNodes[0].gain.rampTo(gainFor(volumePct), 0.08);
});

$("dl").onclick = () => {
  const bin = atob(current.midi), bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([bytes], { type: "audio/midi" }));
  a.download = (current.score.title || "song").replace(/[\\/:*?"<>|]/g, "_") + ".mid";
  a.click(); URL.revokeObjectURL(a.href);
};
</script>
<script type="module">
/*
 * SpessaSynth による高音質試聴。
 * - ライブラリは esm.sh、サウンドフォントは jsDelivr から初回再生時に遅延ロード
 * - ワークレットは CDN (v4.4.7)。CDN が使えない場合は public/ の同一ファイルを使う
 * - 失敗した場合は従来の Tone.js 再生にフォールバックする
 */
const SPESSA_LIB = "https://esm.sh/spessasynth_lib@4.4.7";
const SPESSA_WORKLET = "https://cdn.jsdelivr.net/npm/spessasynth_lib@4.4.7/dist/spessasynth_processor.min.js";
const SPESSA_SOUNDFONT = "https://cdn.jsdelivr.net/gh/spessasus/SpessaSynth@17fb0847ed52c3f1b010447bd87a3e0877bbdcc8/soundfonts/GeneralUserGS.sf3";
const spessaGain = (pct) => 1.2 * Math.pow(pct / 100, 2);

let enginePromise = null;
let engine = null;

async function loadEngine() {
  if (engine) return engine;
  if (!enginePromise) {
    enginePromise = (async () => {
      const { WorkletSynthesizer, Sequencer } = await import(SPESSA_LIB);
      const ctx = new AudioContext();
      // ワークレットは CDN から。CDN が使えない場合はローカル (public/) を使う
      try {
        await ctx.audioWorklet.addModule(SPESSA_WORKLET);
      } catch {
        await ctx.audioWorklet.addModule("./spessasynth_processor.min.js");
      }
      const synth = new WorkletSynthesizer(ctx);
      const master = ctx.createGain();
      master.gain.value = spessaGain(85);
      const limiter = ctx.createDynamicsCompressor();
      limiter.threshold.value = -1.5;
      limiter.knee.value = 0;
      limiter.ratio.value = 20;
      limiter.attack.value = 0.001;
      limiter.release.value = 0.1;
      synth.connect(master);
      master.connect(limiter);
      limiter.connect(ctx.destination);
      const soundfont = await (await fetch(SPESSA_SOUNDFONT)).arrayBuffer();
      await synth.soundBankManager.addSoundBank(soundfont, "main");
      await synth.isReady;
      const seq = new Sequencer(synth);
      engine = { ctx, synth, master, seq };
      return engine;
    })().catch((e) => { enginePromise = null; throw e; });
  }
  return enginePromise;
}

window.SpessaPlayer = {
  async play(midiBase64, volumePct) {
    const { ctx, master, seq } = await loadEngine();
    await ctx.resume();
    master.gain.value = spessaGain(volumePct);
    const bin = atob(midiBase64);
    const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
    try { seq.pause(); } catch {}
    seq.loadNewSongList([{ binary: bytes.buffer }]);
    seq.play();
  },
  /**
   * 読込済みの曲を先頭に戻して再生し直す (ループ継続用。成功時は true)。
   * シークは pause 中に反映されるため、一度 pause してから戻す。
   * 再読込しない分、play() より速く周回できる。
   */
  replay() {
    if (!engine) return false;
    try {
      engine.seq.pause();
      engine.seq.currentTime = 0;
      engine.seq.play();
      return true;
    } catch {
      return false;
    }
  },
  stop() {
    if (!engine) return;
    try { engine.seq.pause(); engine.seq.currentTime = 0; } catch {}
  },
  setVolume(pct) {
    if (engine) engine.master.gain.value = spessaGain(pct);
  },
};

// ---- OPFS 楽曲ライブラリ機能 ----
import { isOpfsSupported, saveSong, listSongs, loadSong, deleteSong, clearAllSongs } from "./opfs-storage.js";

const opfsSupported = isOpfsSupported();

window.updateSaveButton = function() {
  const btn = $("save");
  if (!btn) return;
  if (!opfsSupported) {
    btn.style.display = "none";
    return;
  }
  btn.style.display = "inline-block";
  if (current && current.saved) {
    btn.textContent = "保存済み ✓";
    btn.disabled = true;
  } else {
    btn.textContent = "★ OPFSに保存";
    btn.disabled = !current;
  }
};

async function renderLibrary() {
  const libStatus = $("libStatus");
  const listEl = $("songList");
  const countEl = $("libCount");
  const clearBtn = $("clearAll");

  if (!opfsSupported) {
    libStatus.textContent = "お使いのブラウザは OPFS（端末内プライベート保存）に対応していません。";
    clearBtn.style.display = "none";
    return;
  }

  try {
    const songs = await listSongs();
    countEl.textContent = `${songs.length} 件`;

    if (songs.length === 0) {
      libStatus.textContent = "保存された楽曲はありません。「★ OPFSに保存」を押すとここに記録されます。";
      listEl.innerHTML = "";
      clearBtn.style.display = "none";
      return;
    }

    libStatus.textContent = "";
    clearBtn.style.display = "inline-block";
    listEl.innerHTML = "";

    for (const song of songs) {
      const item = document.createElement("div");
      item.className = "song-item";

      const info = document.createElement("div");
      info.className = "song-info";

      const title = document.createElement("div");
      title.className = "song-title";
      title.textContent = song.title;

      const meta = document.createElement("div");
      meta.className = "song-meta";

      const d = new Date(song.createdAt);
      const dateStr = `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;

      meta.innerHTML = `
        <span class="tag">${song.bpm} BPM</span>
        <span class="tag">${song.key}</span>
        <span class="tag">${song.bars}小節</span>
        ${song.loop ? '<span class="tag">ループ</span>' : ""}
        <span>${dateStr}</span>
      `;
      if (song.prompt) {
        const pDesc = document.createElement("div");
        pDesc.style.fontSize = ".75rem";
        pDesc.style.color = "var(--muted)";
        pDesc.style.marginTop = "2px";
        pDesc.style.whiteSpace = "nowrap";
        pDesc.style.overflow = "hidden";
        pDesc.style.textOverflow = "ellipsis";
        pDesc.textContent = `"${song.prompt}"`;
        info.appendChild(title);
        info.appendChild(meta);
        info.appendChild(pDesc);
      } else {
        info.appendChild(title);
        info.appendChild(meta);
      }

      const actions = document.createElement("div");
      actions.className = "song-actions";

      // 読込ボタン
      const loadBtn = document.createElement("button");
      loadBtn.type = "button";
      loadBtn.className = "secondary sm";
      loadBtn.textContent = "読込";
      loadBtn.onclick = async () => {
        try {
          if (typeof stop === "function") stop();
          const full = await loadSong(song.id);
          // フォーム側のパラメータを復元
          if (full.request) {
            if (full.request.prompt) $("prompt").value = full.request.prompt;
            if (full.request.bars) $("bars").value = String(full.request.bars);
            if (full.request.complexity) $("complexity").value = full.request.complexity;
            if (full.request.ensemble) $("ensemble").value = full.request.ensemble;
            if (typeof full.request.loop === "boolean") $("loop").checked = full.request.loop;
            if (full.request.creativity) $("creativity").value = String(full.request.creativity);
            if (full.request.seed != null) $("seed").value = String(full.request.seed);
            else $("seed").value = "";
          }
          current = { ...full, saved: true };
          show(current);
          window.updateSaveButton();
          $("result").scrollIntoView({ behavior: "smooth" });
        } catch (err) {
          alert("楽曲データの読み込みに失敗しました: " + err.message);
        }
      };

      // MIDI DL ボタン
      const dlBtn = document.createElement("button");
      dlBtn.type = "button";
      dlBtn.className = "secondary sm";
      dlBtn.textContent = "MIDI";
      dlBtn.title = "MIDIファイルをダウンロード";
      dlBtn.onclick = async () => {
        try {
          const full = await loadSong(song.id);
          const bin = atob(full.midi);
          const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
          const a = document.createElement("a");
          a.href = URL.createObjectURL(new Blob([bytes], { type: "audio/midi" }));
          a.download = (song.title || "song").replace(/[\\/:*?"<>|]/g, "_") + ".mid";
          a.click();
          URL.revokeObjectURL(a.href);
        } catch (err) {
          alert("ダウンロードに失敗しました: " + err.message);
        }
      };

      // 削除ボタン
      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "secondary danger sm";
      delBtn.textContent = "削除";
      delBtn.onclick = async () => {
        if (!confirm(`「${song.title}」を削除しますか？`)) return;
        try {
          if (current && current.id === song.id && typeof stop === "function") stop();
          await deleteSong(song.id);
          if (current && current.id === song.id) {
            current.saved = false;
            window.updateSaveButton();
          }
          await renderLibrary();
        } catch (err) {
          alert("削除に失敗しました: " + err.message);
        }
      };

      actions.appendChild(loadBtn);
      actions.appendChild(dlBtn);
      actions.appendChild(delBtn);

      item.appendChild(info);
      item.appendChild(actions);
      listEl.appendChild(item);
    }
  } catch (err) {
    libStatus.textContent = "ライブラリの読み込みに失敗しました: " + err.message;
  }
}

// 保存ボタンのクリックイベント
$("save").onclick = async () => {
  if (!current) return;
  try {
    $("save").disabled = true;
    $("save").textContent = "保存中…";
    await saveSong(current);
    current.saved = true;
    window.updateSaveButton();
    await renderLibrary();
  } catch (err) {
    alert("保存に失敗しました: " + err.message);
    window.updateSaveButton();
  }
};

// 全曲削除ボタンのクリックイベント
$("clearAll").onclick = async () => {
  if (!confirm("保存したすべての楽曲を削除しますか？この操作は取り消せません。")) return;
  try {
    if (typeof stop === "function") stop();
    await clearAllSongs();
    if (current) {
      current.saved = false;
      window.updateSaveButton();
    }
    await renderLibrary();
  } catch (err) {
    alert("全曲削除に失敗しました: " + err.message);
  }
};

// 初期表示
window.updateSaveButton();
renderLibrary();

// 現在のAI設定を表示 (APIキーはサーバーが返さない)
(async () => {
  try {
    const res = await fetch("/api/config");
    const cfg = await res.json();
    const el = document.getElementById("ai-status");
    if (!el) return;
    if (!res.ok) {
      el.textContent = `AI: 設定エラー (${cfg.error ?? "unknown"})`;
      return;
    }
    el.textContent = `AI: ${cfg.label} / ${cfg.model}${cfg.hasApiKey || cfg.auth === "none" ? "" : " (APIキー未設定)"}`;
  } catch {
    const el = document.getElementById("ai-status");
    if (el) el.textContent = "AI: 接続先を取得できませんでした";
  }
})();

</script>
</body>
